<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Rechner</title>
  <meta name="description" content="A simple, offline-ready calculator that works also as a PWA." />

  <!-- Manifest für PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- Favicons für Browser -->
 <link rel="icon" type="image/png" href="icon-512.png">

 <link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32">

  <!-- Apple Touch Icon (iOS Homescreen) -->
  <link rel="apple-touch-icon" href="icon-512.png">

  <!-- Theme-Farben für Browser-UI -->
  <meta name="theme-color" content="#0b0d12">
  <meta name="background-color" content="#0b0d12">

  <!-- Optional: Windows Tile Icons -->
  <meta name="msapplication-TileImage" content="icon-512.png">
  <meta name="msapplication-TileColor" content="#0b0d12">
  
  
<style>
    :root{--bg:#0b0d12;--panel:#121622;--btn:#1b2232;--btn-alt:#24304a;--text:#e9edf5;--muted:#95a3bf;--accent:#6aa1ff;--danger:#ff6b6b;--radius:18px;--shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);}
    @media (prefers-color-scheme: light){:root{--bg:#f5f7fb;--panel:#ffffff;--btn:#f1f4fb;--btn-alt:#e7ecf8;--text:#0b0d12;--muted:#5a6782;--accent:#2f6dff;--danger:#d14343;}}
    *{box-sizing:border-box} html,body{height:100%} body{margin:0;font:18px system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial;background:radial-gradient(1200px 800px at 80% -20%, rgba(106,161,255,.15), transparent 60%),var(--bg);color:var(--text);display:grid;place-items:center;-webkit-tap-highlight-color: transparent;}
    
    /* Die Breite bleibt im Advanced-Modus KONSTANT */
    .app{width:min(460px,95vw);padding:18px;border-radius:var(--radius);background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01)),var(--panel);box-shadow:var(--shadow); transition: all 0.3s ease;}
    
    .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px} h1{font-size:20px;margin:0;letter-spacing:.3px;font-weight:700} .credits{font-size:12px;color:var(--muted)}
    .display{position:relative;border-radius:14px;background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.06));padding:20px;min-height:100px;box-shadow:inset 0 2px 12px rgba(0,0,0,.25)}
    .expr{font-size:15px;color:var(--muted);min-height:20px;word-wrap:break-word} .value{font-size:38px;line-height:1.3;font-variant-numeric:tabular-nums;word-wrap:break-word}
    
    .keys-container{margin-top:14px;} 
    
    /* Standard-Tastenfeld (4 Spalten) */
    .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px; } 
    
 /* Advanced Tastenfeld (NEU: 4 Spalten) */
.keys.advanced-keys{
    grid-template-columns:repeat(4,1fr); /* Jetzt 4 Spalten, passend zum Standardfeld */
    gap:12px;
    margin-bottom: 0;
    display: grid; 
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, opacity 0.4s ease, margin-bottom 0.4s ease;
}
    
/* Advanced Modus: Tastenfeld wird sichtbar */
.app.advanced .keys.advanced-keys{
    max-height: 200px; /* Platz für 3 Reihen Tasten + Gaps */
    opacity: 1;
    margin-bottom: 12px;
}
    
    /* Standard Button Styling */
    button{appearance:none;border:none;border-radius:16px;background:var(--btn);color:var(--text);padding:22px;font-size:22px;cursor:pointer;box-shadow:var(--shadow);transition: transform .06s ease, filter .2s ease;touch-action: manipulation;} 
    
/* ⭐ KORREKTUR: Advanced Key Styling - Kleinere Größe und Schrift */
.advanced-key{
    padding: 12px;
    font-size: 16px; 
    grid-column: span 1; /* Jede Advanced-Taste nimmt nur 1 Spalte ein */
}
    
    button:active{transform:scale(0.96)} button:focus-visible{outline:2px solid var(--accent);outline-offset:2px} button[data-variant="op"]{background:var(--btn-alt)} button[data-variant="accent"]{background:linear-gradient(180deg, rgba(106,161,255,.22), rgba(106,161,255,.1));} button[data-variant="danger"]{background:linear-gradient(180deg, rgba(255,107,107,.25), rgba(255,107,107,.12));} .span-2{grid-column:span 2} .sr-only{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
    .footer{margin-top:14px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;flex-wrap:wrap} .switcher{display:flex;gap:8px} .switch{background:transparent;box-shadow:none;border:1px solid rgba(255,255,255,.08);padding:8px 10px;font-size:12px}
</style>
</head>
<body>
  <main class="app" role="application" aria-label="Calculator">
    <div class="top">
      <h1>Rechner</h1>
      <div class="credits" id="status">Normal</div>
    </div>

    <section class="display" aria-live="polite">
      <div class="expr" id="expr"></div>
      <div class="value" id="value">0</div>
    </section>

    <div class="keys-container">
      <section class="keys advanced-keys" aria-label="Advanced functions keypad">
        <button data-fn="sin" data-variant="op" class="advanced-key" title="Sine">sin</button>
        <button data-fn="cos" data-variant="op" class="advanced-key" title="Cosine">cos</button>
        <button data-fn="tan" data-variant="op" class="advanced-key" title="Tangent">tan</button>
        <button data-fn="sqrt" data-variant="op" class="advanced-key" title="Square Root">√</button>
        <button data-fn="pow2" data-variant="op" class="advanced-key" title="Square">x²</button>
        <button data-op="yroot" data-variant="op" class="advanced-key" title="y-th root">ⁿ√x</button>
        <button data-fn="log10" data-variant="op" class="advanced-key" title="Logarithm (Base 10)">log</button>
        <button data-fn="ln" data-variant="op" class="advanced-key" title="Natural Logarithm (Base e)">ln</button>
        <button data-op="logx" data-variant="op" class="advanced-key" title="Logarithm (Base x)">logᵪ</button>
        <button data-const="PI" data-variant="op" class="advanced-key" title="Pi (π)">π</button>
        <button data-const="E" data-variant="op" class="advanced-key" title="Euler's Number (e)">e</button>
        <button data-fn="fact" data-variant="op" class="advanced-key" title="Factorial">n!</button>
      </section>

      <section class="keys" aria-label="Standard calculator keypad">
        <button data-key="Escape" data-variant="danger" title="Clear (Esc)">AC</button>
        <button data-key="Backspace" title="Backspace">⌫</button>
        <button data-op="%" data-variant="op" title="Percent">%</button>
        <button data-op="/" data-variant="op" title="Divide">÷</button>
        <button data-num="7">7</button>
        <button data-num="8">8</button>
        <button data-num="9">9</button>
        <button data-op="*" data-variant="op" title="Multiply">×</button>
        <button data-num="4">4</button>
        <button data-num="5">5</button>
        <button data-num="6">6</button>
        <button data-op="-" data-variant="op" title="Minus">−</button>
        <button data-num="1">1</button>
        <button data-num="2">2</button>
        <button data-num="3">3</button>
        <button data-op="+" data-variant="op" title="Plus">+</button>
        <button data-num="0" class="span-2">0</button>
        <button data-dot=".">,</button>
        <button data-equals="=" data-variant="accent" title="Equals (=)">=</button>
        <button data-paren="(" title="Left parenthesis">(</button>
        <button data-paren=")" title="Right parenthesis">)</button>
        <button data-op="^" data-variant="op" title="Power">^</button>
        <button data-sign="±" title="Toggle sign">±</button>
      </section>
    </div>

    <div class="footer">
      <span>Tastatur: 0–9 • Komma oder Punkt • + − × ÷ • ( ) • % ^ • Enter • Esc • Backspace</span>
      <div class="switcher">
        <button class="switch" id="copy">Kopieren</button>
        <button class="switch" id="swap">Erweitert</button>
      </div>
    </div>
  </main>

<script>
(() => {
  'use strict';
  const appEl = document.querySelector('.app');
  const valueEl = document.getElementById('value');
  const exprEl = document.getElementById('expr');
  const statusEl = document.getElementById('status');
  let expr = '', currentNumber = '0', isResult = false, isAdvanced = false;
  let lastResult = null;
  const ops = ['+', '-', '*', '/', '%', '^', 'yroot', 'logx'];
  const functions = ['sin', 'cos', 'tan', 'sqrt', 'pow2', 'log10', 'ln', 'fact'];
  const numberAtEnd = /(?:\d+(?:\.\d*)?|\.\d+)$/;
  const german = new Intl.NumberFormat('de-DE', {maximumFractionDigits:12, useGrouping:false});

  function resultString(n) {
    if (!Number.isFinite(n)) throw Error('Undefiniertes Ergebnis');
    if (n === 0) return '0';
    // Kein Runden von Eingaben! Ergebnis höchstens 12 signifikante Stellen.
    const rounded = Number(n.toPrecision(12));
    return String(rounded);
  }
  function displayNumber(s) {
    if (s === 'Error') return 'Fehler';
    // Tausenderpunkte werden nur in der Anzeige erzeugt, nie im Rechenkern.
    if (/^-?\d+(?:\.\d*)?$/.test(s)) {
      const [integer, fraction] = s.split('.');
      const grouped = integer.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return fraction === undefined ? grouped : grouped + ',' + fraction;
    }
    return s.replace(/\./g, ',');
  }
  function prettify(s) {
    return s.replace(/yroot/g, 'ⁿ√').replace(/logx/g, 'logᵪ')
      .replace(/sqrt/g, '√').replace(/\*/g, '×').replace(/\//g, '÷')
      .replace(/-/g, '−').replace(/(\d)\.(\d)/g, '$1,$2');
  }
  function updateDisplay() {
    exprEl.textContent = prettify(expr);
    valueEl.textContent = displayNumber(currentNumber);
    statusEl.textContent = isAdvanced ? 'Advanced' : 'Normal';
  }
  function clearAll() {
    expr = ''; currentNumber = '0'; isResult = false; lastResult = null; updateDisplay();
  }
  function afterResultForNewInput() {
    if (isResult) {expr = ''; currentNumber = '0'; isResult = false; lastResult = null;}
  }
  function afterResultForOperation() {
    if (isResult) {expr = lastResult === null ? '' : resultString(lastResult); isResult = false;}
  }
  function trailingNumber() {return expr.match(numberAtEnd)?.[0] ?? '';}
  function endsValue() {return /(?:[\d)]|pi|e)$/.test(expr);}
  function lastIsBinaryOp() {return /(?:[+*/%^]|yroot|logx)$/.test(expr) || (expr.endsWith('-') && !isUnaryMinusAtEnd());}
  function isUnaryMinusAtEnd() {
    if (!expr.endsWith('-')) return false;
    const base = expr.slice(0,-1);
    return !base || /(?:[+*/%^(-]|yroot|logx)$/.test(base);
  }
  function pushNum(n) {
    afterResultForNewInput();
    if (expr.endsWith(')') || expr.endsWith('pi') || expr.endsWith('e')) expr += '*';
    let t = trailingNumber();
    if (t) {
      if (t === '0') expr = expr.slice(0,-1) + n;
      else expr += n;
    } else expr += n;
    currentNumber = trailingNumber() || n;
    updateDisplay();
  }
  function pushDot() {
    afterResultForNewInput();
    if (expr.endsWith(')') || expr.endsWith('pi') || expr.endsWith('e')) expr += '*';
    const t = trailingNumber();
    if (t.includes('.')) return;
    expr += t ? '.' : '0.';
    currentNumber = trailingNumber() || '0.';
    updateDisplay();
  }
  function pushOp(op) {
    afterResultForOperation();
    if (!expr) {
      if (op === '-') expr = '-';
      else return;
    } else if (expr.endsWith('(')) {
      if (op === '-') expr += '-'; else return;
    } else if (lastIsBinaryOp()) {
      if (op === '-' && !expr.endsWith('--')) expr += '-';
      else expr = expr.replace(/(?:yroot|logx|[+*/%^\-])$/, op);
    } else if (isUnaryMinusAtEnd()) {
      // Ein zweites Minus ignorieren; andere Operatoren ersetzen nur das Vorzeichen.
      if (op !== '-') expr = expr.slice(0,-1) + op;
    } else if (endsValue()) expr += op;
    else return;
    currentNumber = '0'; updateDisplay();
  }
  function pushParen(p) {
    afterResultForNewInput();
    if (p === '(') {
      if (endsValue()) expr += '*';
      expr += '(';
    } else {
      const opens = (expr.match(/\(/g)||[]).length, closes=(expr.match(/\)/g)||[]).length;
      if (opens > closes && endsValue()) expr += ')'; else return;
    }
    currentNumber = trailingNumber() || '0'; updateDisplay();
  }
  function backspace() {
    if (isResult) {afterResultForOperation();}
    if (expr.endsWith('yroot')) expr = expr.slice(0,-5);
    else if (expr.endsWith('logx')) expr = expr.slice(0,-4);
    else expr = expr.slice(0,-1);
    currentNumber = trailingNumber() || '0'; updateDisplay();
  }
  function toggleSign() {
    if (isResult) {
      if (lastResult === null) return;
      lastResult = -lastResult; expr = resultString(lastResult);
      currentNumber = expr; isResult = true; updateDisplay(); return;
    }
    const m = expr.match(numberAtEnd);
    if (!m) { if (!expr || lastIsBinaryOp() || expr.endsWith('(')) expr += '-'; updateDisplay(); return; }
    const start = m.index, prefix = expr.slice(0,start);
    const precedingMinusIsUnary = prefix.endsWith('-') && (!prefix.slice(0,-1) || /(?:[+*/%^(-]|yroot|logx)$/.test(prefix.slice(0,-1)));
    if (precedingMinusIsUnary) expr = prefix.slice(0,-1) + m[0];
    else expr = prefix + '-' + m[0];
    currentNumber = (precedingMinusIsUnary ? '' : '-') + m[0]; updateDisplay();
  }
  function pushFunction(fn) {
    afterResultForNewInput();
    if (endsValue()) expr += '*';
    expr += fn + '('; currentNumber = '0'; updateDisplay();
  }
  function pushConstant(c) {
    afterResultForNewInput();
    if (endsValue()) expr += '*';
    // Konstante als voller numerischer Wert, nicht auf 12 Stellen gekürzt.
    expr += c === 'PI' ? 'pi' : 'e';
    currentNumber = resultString(c === 'PI' ? Math.PI : Math.E); updateDisplay();
  }
  function toggleMode() {
    isAdvanced = !isAdvanced;
    appEl.classList.toggle('advanced', isAdvanced);
    updateDisplay(); // Beim Moduswechsel Rechnung NICHT löschen.
  }

  // Lexer mit strengem Dezimalformat; deutsche Eingaben werden vorab normalisiert.
  function tokenize(input) {
    const s = input.replace(/,/g,'.').replace(/−/g,'-').replace(/×/g,'*').replace(/÷/g,'/');
    const tokens = []; let i=0;
    while (i<s.length) {
      if (/\s/.test(s[i])) {i++;continue;}
      const rest=s.slice(i);
      const m = rest.match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+\-]?\d+)?/);
      if (m) {const n=Number(m[0]); if (!Number.isFinite(n)) throw Error('Ungültige Zahl'); tokens.push({type:'number',value:n}); i+=m[0].length; continue;}
      const id=rest.match(/^(?:yroot|logx|log10|sqrt|pow2|fact|sin|cos|tan|ln|pi|e)/);
      if(id) {tokens.push({type:'id',value:id[0]});i+=id[0].length;continue;}
      if('()+-*/%^'.includes(s[i])) {tokens.push({type:s[i],value:s[i]});i++;continue;}
      throw Error('Ungültiges Zeichen: '+s[i]);
    }
    tokens.push({type:'EOF'});return tokens;
  }
  function compute(input) {
    const tokens=tokenize(input); let pos=0;
    const peek=()=>tokens[pos];
    const take=(type)=>{if(peek().type!==type)throw Error('Erwartet: '+type);return tokens[pos++];};
    function atom() {
      const t=peek();
      if(t.type==='number') {pos++;return t.value;}
      if(t.type==='(') {pos++;const a=parse(0);take(')');return a;}
      if(t.type==='id') {
        pos++;
        if(t.value==='pi') return Math.PI;
        if(t.value==='e') return Math.E;
        if(!functions.includes(t.value)) throw Error('Unbekannte Funktion: '+t.value);
        take('('); const a=parse(0);take(')');
        switch(t.value) {
          case 'sin': return Math.sin(a); case 'cos':return Math.cos(a);
          case 'tan':return Math.tan(a);case 'sqrt':return Math.sqrt(a);
          case 'pow2':return a*a;case 'log10':return Math.log10(a);
          case 'ln':return Math.log(a);
          case 'fact': {
            if(!Number.isInteger(a)||a<0||a>170)throw Error('Fakultät nur von 0 bis 170');
            let r=1; for(let i=2;i<=a;i++)r*=i;return r;
          }
        }
      }
      if(t.type==='-' || t.type==='+') {pos++;const v=parse(3);return t.type==='-'?-v:v;}
      throw Error('Zahl oder Klammer erwartet');
    }
    const prio={'+':1,'-':1,'*':2,'/':2,'%':2,'^':4,yroot:4,logx:4};
    function parse(minPrec) {
      let left=atom();
      while(true) {
        const t=peek(); const op=t.type==='id' ? t.value : t.type;
        const p=prio[op];if(p===undefined||p<minPrec)break;
        pos++;const right=parse(p+(op==='^'?0:1));
        switch(op) {
          case '+':left+=right;break;case '-':left-=right;break;
          case '*':left*=right;break;case '/':left/=right;break;
          case '%':left%=right;break;case '^':left=Math.pow(left,right);break;
          case 'yroot':left=Math.pow(right,1/left);break;
          case 'logx':left=Math.log(right)/Math.log(left);break;
        }
      }
      return left;
    }
    const value=parse(0);if(peek().type!=='EOF')throw Error('Ungültige oder unvollständige Eingabe');
    if(!Number.isFinite(value))throw Error('Ergebnis nicht definiert');return value;
  }
  function equals() {
    if (!expr || isResult) return;
    let input=expr;
    // Echte Tippfehler melden, statt stillschweigend Operatoren zu entfernen.
    const opens=(input.match(/\(/g)||[]).length, closes=(input.match(/\)/g)||[]).length;
    if(opens>closes && /(?:[\d)]|pi|e)$/.test(input)) input+=')'.repeat(opens-closes);
    try {
      const result=compute(input);
      lastResult=result; currentNumber=resultString(result);
      expr=input+'='+currentNumber; isResult=true;updateDisplay();
    } catch(e) {
      lastResult=null;currentNumber='Error';isResult=true;expr=input+'=';updateDisplay();
      console.warn('Rechenfehler:', e.message);
    }
  }
  document.querySelectorAll('button[data-num]').forEach(b=>b.addEventListener('click',()=>pushNum(b.dataset.num)));
  document.querySelectorAll('button[data-op]').forEach(b=>b.addEventListener('click',()=>pushOp(b.dataset.op)));
  document.querySelectorAll('button[data-fn]').forEach(b=>b.addEventListener('click',()=>pushFunction(b.dataset.fn)));
  document.querySelectorAll('button[data-const]').forEach(b=>b.addEventListener('click',()=>pushConstant(b.dataset.const)));
  document.querySelector('button[data-dot]').addEventListener('click',pushDot);
  document.querySelector('button[data-equals]').addEventListener('click',equals);
  document.querySelector('button[data-sign]').addEventListener('click',toggleSign);
  document.querySelector('button[data-key="Escape"]').addEventListener('click',clearAll);
  document.querySelector('button[data-key="Backspace"]').addEventListener('click',backspace);
  document.querySelectorAll('button[data-paren]').forEach(b=>b.addEventListener('click',()=>pushParen(b.dataset.paren)));
  document.getElementById('swap').addEventListener('click',toggleMode);
  function flash(s){statusEl.textContent=s;setTimeout(updateDisplay,1200);}
  document.getElementById('copy').addEventListener('click',async()=>{
    try {await navigator.clipboard.writeText(displayNumber(currentNumber));flash('Kopiert');}
    catch {flash('Kopieren fehlgeschlagen');}
  });
  window.addEventListener('keydown',e=>{
    const k=e.key;
    if(/^[0-9]$/.test(k))pushNum(k);
    else if(k==='.'||k===',')pushDot();
    else if(['+','-','*','/','%','^'].includes(k))pushOp(k);
    else if(k==='('||k===')')pushParen(k);
    else if(k==='Enter'||k==='=')equals();
    else if(k==='Backspace')backspace();
    else if(k==='Escape')clearAll();
    else if(isAdvanced && ({s:'sin',c:'cos',t:'tan',r:'sqrt'}[k.toLowerCase()])) pushFunction({s:'sin',c:'cos',t:'tan',r:'sqrt'}[k.toLowerCase()]);
    else if(isAdvanced && k.toLowerCase()==='p')pushConstant('PI');
    else return;
    e.preventDefault();
  });
  updateDisplay();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(console.warn);
  // Für die automatisierten Tests; kein Eingriff in das UI.
  window.__calculatorTest = {compute,tokenize,pushNum,pushDot,pushOp,equals,clearAll,toggleSign,getState:()=>({expr,currentNumber,isResult})};
})();
</script>
</body>
</html>
